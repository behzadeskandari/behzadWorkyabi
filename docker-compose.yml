services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iranjob-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the environment}
    ports:
      - "1433:1433"
    volumes:
      - iranjob-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    profiles:
      - full
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: iranjob-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${IRANJOB_DB_CONNECTION_STRING:?Set IRANJOB_DB_CONNECTION_STRING in the environment}
      Authentication__Jwt__SecretKey: ${IRANJOB_JWT_SIGNING_KEY:?Set IRANJOB_JWT_SIGNING_KEY in the environment}
      Database__ApplyMigrationsOnStartup: ${DATABASE_APPLY_MIGRATIONS_ON_STARTUP:-false}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:?Set CORS_ALLOWED_ORIGIN to the exact browser origin}
      Payment__PublishFeeAmount: ${PAYMENT_PUBLISH_FEE_AMOUNT:?Set PAYMENT_PUBLISH_FEE_AMOUNT explicitly; use 0 to disable paid publishing}
      Payment__PublishFeeCurrency: ${PAYMENT_PUBLISH_FEE_CURRENCY:-IRR}
      Payment__ZarinPal__MerchantId: ${ZARINPAL_MERCHANT_ID:-}
      Payment__ZarinPal__CallbackUrl: ${ZARINPAL_CALLBACK_URL:-}
      Payment__ZarinPal__Sandbox: ${ZARINPAL_SANDBOX:?Set ZARINPAL_SANDBOX explicitly to true or false}
      Payment__ZarinPal__RequestUrl: ${ZARINPAL_REQUEST_URL:-https://api.zarinpal.com/pg/v4/payment/request.json}
      Payment__ZarinPal__VerifyUrl: ${ZARINPAL_VERIFY_URL:-https://api.zarinpal.com/pg/v4/payment/verify.json}
      Payment__ZarinPal__SandboxRequestUrl: ${ZARINPAL_SANDBOX_REQUEST_URL:-https://sandbox.zarinpal.com/pg/v4/payment/request.json}
      Payment__ZarinPal__SandboxVerifyUrl: ${ZARINPAL_SANDBOX_VERIFY_URL:-https://sandbox.zarinpal.com/pg/v4/payment/verify.json}
      Payment__ZarinPal__StartPayUrl: ${ZARINPAL_START_PAY_URL:-https://www.zarinpal.com/pg/StartPay/{0}}
      Payment__ZarinPal__StartPaySandboxUrl: ${ZARINPAL_SANDBOX_START_PAY_URL:-https://sandbox.zarinpal.com/pg/StartPay/{0}}
    ports:
      - "5158:8080"
    volumes:
      - iranjob-api-uploads:/app/uploads
      - iranjob-api-cv-storage:/app/cv-storage
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    profiles:
      - full
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: iranjob-web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  iranjob-sqlserver-data:
  iranjob-api-uploads:
  iranjob-api-cv-storage:

