services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iranjob-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - iranjob-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    profiles:
      - full
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: iranjob-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IranJob;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;Encrypt=False"
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "5158:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    profiles:
      - full
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: iranjob-web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  iranjob-sqlserver-data:
