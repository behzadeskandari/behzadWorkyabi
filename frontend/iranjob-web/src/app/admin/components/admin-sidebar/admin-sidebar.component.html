<aside class="admin-sidebar" [class.open]="isOpen">
  <div class="admin-sidebar__overlay" (click)="isOpen = false"></div>

  <nav class="admin-sidebar__nav">
    <div class="admin-sidebar__brand">
      <span class="admin-sidebar__brand-icon">🛠️</span>
      <span>پنل ادمین</span>
    </div>

    <div class="admin-sidebar__user">
      <span class="admin-sidebar__user-name">
        {{ authService.currentUser()?.firstName }} {{ authService.currentUser()?.lastName }}
      </span>
      <span class="admin-sidebar__user-roles">
        <ng-container *ngFor="let role of displayedRoles">
          <span class="admin-sidebar__role-badge">{{ getRoleName(role) }}</span>
        </ng-container>
      </span>
    </div>

    <ul class="admin-sidebar__menu">
      <li *ngFor="let item of adminNavItems" class="admin-sidebar__menu-item">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="admin-sidebar__menu-link"
        >
          <span class="admin-sidebar__menu-icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      </li>

      <li *ngIf="isSuperAdmin()" class="admin-sidebar__section-divider">
        <span class="admin-sidebar__section-label">سوپر ادمین</span>
      </li>

      <li *ngFor="let item of superAdminNavItems" class="admin-sidebar__menu-item">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="admin-sidebar__menu-link"
          [class.coming-soon]="item.comingSoon"
          [attr.aria-label]="item.comingSoon ? item.label + ' (فاز ' + item.phase + ' در دسترس)' : item.label"
          (click)="item.comingSoon && $event.preventDefault()"
        >
          <span class="admin-sidebar__menu-icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
          <span *ngIf="item.comingSoon" class="admin-sidebar__badge">{{ item.phase }}</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>
