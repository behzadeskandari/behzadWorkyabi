<div class="login-container">
  <div class="login-card">
    <h1>ورود به ایران‌جاب</h1>
    
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="identifier">ایمیل یا شماره موبایل</label>
        <input
          id="identifier"
          type="text"
          formControlName="identifier"
          placeholder="example@email.com یا 09xxxxxxxxx"
          [disabled]="isLoading"
        />
      </div>

      <div class="form-group">
        <label for="password">رمز عبور</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="رمز عبور خود را وارد کنید"
          [disabled]="isLoading"
        />
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">ورود</span>
        <span *ngIf="isLoading">در حال ورود...</span>
      </button>
    </form>

    <div class="links">
      <a routerLink="/register">ثبت‌نام</a>
      <span class="separator">|</span>
      <span class="disabled" title="این قابلیت در فازهای بعدی اضافه می‌شود">فراموشی رمز عبور</span>
    </div>
  </div>
</div>
