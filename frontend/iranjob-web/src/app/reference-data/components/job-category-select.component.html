<div class="category-select" dir="rtl">
  <label class="category-select__label" [attr.for]="selectId">
    {{ label }}
  </label>

  <div class="category-select__control" [class.is-loading]="isLoading" [class.has-error]="!!errorMessage">
    <select
      [id]="selectId"
      class="category-select__input"
      [value]="value ?? ''"
      [disabled]="isLoading || !!errorMessage"
      (change)="onSelectionChange($event)"
      [attr.aria-busy]="isLoading"
      [attr.aria-invalid]="!!errorMessage"
    >
      <option value="">انتخاب دسته‌بندی…</option>
      <option *ngFor="let category of categories" [value]="category.id">
        {{ category.name }}
      </option>
    </select>
    <span class="category-select__chevron" aria-hidden="true">▾</span>
  </div>

  <p *ngIf="isLoading" class="category-select__hint" role="status">
    در حال بارگذاری دسته‌بندی‌ها…
  </p>

  <div *ngIf="errorMessage" class="category-select__error" role="alert">
    <span>{{ errorMessage }}</span>
    <button type="button" class="category-select__retry" (click)="loadCategories()">
      تلاش دوباره
    </button>
  </div>
</div>
